<path d="M1097 284 V380 H864" class="dasharrow"/><text x="1010" y="343" class="tiny">邊界更新</text>

<rect x="334" y="444" width="884" height="124" class="boundary"/>
<text x="356" y="476" text-anchor="start" class="title">核心 / eBPF 快速路徑</text>
<rect x="356" y="506" width="104" height="42" class="box2"/><text x="408" y="526" text-anchor="middle" class="label">封包</text><text x="408" y="543" text-anchor="middle" class="small">入口</text>
<rect x="520" y="494" width="380" height="66" class="box2"/><text x="710" y="516" text-anchor="middle" class="label">XDP 快速路徑</text><text x="710" y="537" text-anchor="middle" class="small">解析、黑名單、SYN 路徑、狀態更新</text><text x="710" y="555" text-anchor="middle" class="small">Contract5 重建、5-bit index、查表評分</text>
