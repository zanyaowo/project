<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">System architecture of the eBPF DDoS defense</title>
  <desc id="desc">A thesis-style architecture diagram separating offline model export, Rust userspace control, BPF maps, and the eBPF kernel data path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .outer { fill: #ffffff; stroke: #222222; stroke-width: 1.7; }
      .partition { fill: #f8f8f8; stroke: #555555; stroke-width: 1.3; }
      .external { fill: #fbfbfb; stroke: #444444; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .box-gray { fill: #f2f2f2; stroke: #222222; stroke-width: 1.5; }
      .box-dashed { fill: #ffffff; stroke: #666666; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .label { font: 700 20px Arial, "Noto Sans TC", sans-serif; fill: #111111; }
      .title { font: 700 17px Arial, "Noto Sans TC", sans-serif; fill: #111111; }
      .text { font: 500 14px Arial, "Noto Sans TC", sans-serif; fill: #222222; }
      .small { font: 500 12.5px Arial, "Noto Sans TC", sans-serif; fill: #333333; }
      .mono { font: 500 12.5px Menlo, Consolas, monospace; fill: #222222; }
      .flow { fill: none; stroke: #1d1d1d; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #1d1d1d; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .event { fill: none; stroke: #555555; stroke-width: 1.6; stroke-dasharray: 2 5; marker-end: url(#arrow-gray); }
      .muted { fill: none; stroke: #555555; stroke-width: 1.6; marker-end: url(#arrow-gray); }
      .legend-line { stroke: #1d1d1d; stroke-width: 2; }
      .legend-dash { stroke: #1d1d1d; stroke-width: 1.8; stroke-dasharray: 8 6; }
      .legend-dot { stroke: #555555; stroke-width: 1.6; stroke-dasharray: 2 5; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Offline model export, kept outside the runtime host boundary. -->
  <rect x="42" y="76" width="224" height="522" class="external"/>
  <text x="62" y="108" class="label">Offline model export</text>
  <text x="62" y="132" class="small">not on runtime packet path</text>

  <rect x="70" y="170" width="168" height="44" class="box-gray"/>
  <text x="154" y="188" text-anchor="middle" class="text">BENIGN-only</text>
  <text x="154" y="207" text-anchor="middle" class="small">CIC-IDS-2019</text>

  <rect x="70" y="252" width="168" height="44" class="box-gray"/>
  <text x="154" y="270" text-anchor="middle" class="text">Teacher model</text>
  <text x="154" y="289" text-anchor="middle" class="small">Contract5 continuous IF</text>

  <rect x="70" y="334" width="168" height="44" class="box-gray"/>
  <text x="154" y="352" text-anchor="middle" class="text">Distillation</text>
  <text x="154" y="371" text-anchor="middle" class="small">N=2 quantile buckets</text>

  <rect x="70" y="416" width="168" height="44" class="box-gray"/>
  <text x="154" y="442" text-anchor="middle" class="mono">distilled_rules.json</text>

  <path class="muted" d="M154 214 V240"/>
  <path class="muted" d="M154 296 V322"/>
  <path class="muted" d="M154 378 V404"/>

  <!-- Runtime host boundary. -->
  <rect x="314" y="76" width="924" height="522" class="outer"/>
  <text x="334" y="108" class="label">Runtime host</text>

  <rect x="334" y="132" width="884" height="188" class="partition"/>
  <text x="356" y="164" class="label">Rust userspace control plane</text>
  <text x="356" y="188" class="small">loads parameters, records events, and guards adaptive boundary updates</text>

  <rect x="356" y="224" width="150" height="48" class="box"/>
  <text x="431" y="244" text-anchor="middle" class="title">Loader</text>
  <text x="431" y="263" text-anchor="middle" class="mono">model.json</text>

  <rect x="800" y="224" width="168" height="48" class="box"/>
  <text x="884" y="244" text-anchor="middle" class="title">Stats logger</text>
  <text x="884" y="263" text-anchor="middle" class="small">sampled score events</text>

  <rect x="1010" y="212" width="174" height="72" class="box"/>
  <text x="1097" y="236" text-anchor="middle" class="title">Boundary updater</text>
  <text x="1097" y="256" text-anchor="middle" class="small">dual sketch gate</text>
  <text x="1097" y="276" text-anchor="middle" class="small">Normal / Uncertain / Freeze</text>


  <!-- BPF maps as the contract between userspace and eBPF programs. -->
  <rect x="500" y="346" width="360" height="70" class="box-gray"/>
  <text x="680" y="371" text-anchor="middle" class="title">BPF maps</text>
  <text x="680" y="392" text-anchor="middle" class="small">QUANTILE_BOUNDS, SCORE_TABLE, metadata, block list</text>

  <rect x="334" y="444" width="884" height="122" class="partition"/>
  <text x="356" y="476" class="label">Kernel / eBPF fast path</text>

  <rect x="356" y="506" width="104" height="42" class="box"/>
  <text x="408" y="523" text-anchor="middle" class="title">Packet</text>
  <text x="408" y="541" text-anchor="middle" class="small">ingress</text>

  <rect x="520" y="494" width="190" height="66" class="box"/>
  <text x="615" y="517" text-anchor="middle" class="title">XDP</text>
  <text x="615" y="538" text-anchor="middle" class="small">parse, block list, SYN path</text>
  <text x="615" y="556" text-anchor="middle" class="small">session update</text>

  <rect x="776" y="494" width="216" height="66" class="box"/>
  <text x="884" y="517" text-anchor="middle" class="title">TC scorer</text>
  <text x="884" y="538" text-anchor="middle" class="small">Contract5 reconstruction</text>
  <text x="884" y="556" text-anchor="middle" class="small">5-bit index, score lookup</text>

  <rect x="1060" y="482" width="116" height="36" class="box"/>
  <text x="1118" y="505" text-anchor="middle" class="title">PASS</text>

  <rect x="1060" y="536" width="116" height="36" class="box"/>
  <text x="1118" y="559" text-anchor="middle" class="title">LIMIT / DROP</text>

  <!-- Runtime data path. -->
  <path class="flow" d="M460 527 H508"/>
  <path class="flow" d="M710 527 H764"/>
  <path class="flow" d="M992 509 H1048"/>
  <path class="flow" d="M992 548 H1048"/>

  <!-- Contract/control flow, kept orthogonal to the packet path. -->
  <path class="control" d="M238 438 H298 V248 H344"/>
  <text x="250" y="236" class="small">exported rules</text>

  <path class="control" d="M431 272 V381 H488"/>
  <text x="444" y="326" class="small">load maps</text>

  <path class="control" d="M1097 284 V381 H872"/>
  <text x="1010" y="342" class="small">boundary update</text>

  <path class="control" d="M680 416 V482"/>
  <text x="692" y="456" class="small">lookup parameters</text>

  <path class="event" d="M884 494 V284"/>
  <text x="894" y="390" class="small">sampled events</text>


  <!-- Scope note and legend. -->
  <rect x="42" y="630" width="660" height="48" class="box-dashed"/>
  <text x="62" y="650" class="title">Scope note</text>
  <text x="62" y="669" class="small">Runtime inference is the eBPF 5-bit SCORE_TABLE. Full IF is offline-only; Layer 2 IF is not implemented.</text>

  <rect x="760" y="630" width="478" height="48" class="box"/>
  <line x1="786" y1="654" x2="828" y2="654" class="legend-line" marker-end="url(#arrow)"/>
  <text x="840" y="659" class="small">packet path</text>
  <line x1="944" y1="654" x2="986" y2="654" class="legend-dash" marker-end="url(#arrow)"/>
  <text x="998" y="659" class="small">control / map update</text>
  <line x1="1160" y1="654" x2="1202" y2="654" class="legend-dot" marker-end="url(#arrow-gray)"/>
  <text x="1214" y="659" class="small">event</text>
</svg>
