<rect x="356" y="224" width="150" height="48" class="box2"/><text x="431" y="244" text-anchor="middle" class="label">載入器</text><text x="431" y="263" text-anchor="middle" class="code">model.json</text>
<rect x="800" y="224" width="168" height="48" class="box2"/><text x="884" y="244" text-anchor="middle" class="label">統計記錄器</text><text x="884" y="263" text-anchor="middle" class="small">取樣分數事件</text>
<rect x="1010" y="212" width="174" height="72" class="box2"/><text x="1097" y="234" text-anchor="middle" class="label">邊界更新器</text><text x="1097" y="252" text-anchor="middle" class="small">雙草圖閘控</text><text x="1097" y="268" text-anchor="middle" class="small">Normal / Uncertain /</text><text x="1097" y="282" text-anchor="middle" class="small">AttackFreeze</text>

<rect x="500" y="346" width="360" height="72" class="box"/><text x="680" y="368" text-anchor="middle" class="label">BPF maps</text><text x="680" y="390" text-anchor="middle" class="small">QUANTILE_BOUNDS、SCORE_TABLE、中介資料、黑名單</text>
