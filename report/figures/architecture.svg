<path d="M900 520 H940" class="arrow"/>
<path d="M900 548 H940" class="arrow"/>
<path d="M900 527 C945 620 1050 620 1133 570" class="dasharrow"/>
<line x1="680" y1="418" x2="680" y2="486" class="dasharrow"/><text x="694" y="456" class="tiny">查詢參數</text>
