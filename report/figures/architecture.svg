<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#111"/></marker>
  <marker id="arrowGrey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
</defs>
<style>
  .bg { fill: #ffffff; }
  .boundary { fill: #f7f7f7; stroke: #444; stroke-width: 1.5; }
  .box { fill: #f1f1f1; stroke: #333; stroke-width: 1.5; }
  .box2 { fill: #ffffff; stroke: #333; stroke-width: 1.4; }
  .dash { fill: #ffffff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 7 5; }
  .title { font: 700 20px Arial, 'Noto Sans CJK TC', sans-serif; fill: #111; }
  .subtitle { font: 400 12px Arial, 'Noto Sans CJK TC', sans-serif; fill: #333; }
  .label { font: 700 16px Arial, 'Noto Sans CJK TC', sans-serif; fill: #111; }
  .small { font: 400 12px Arial, 'Noto Sans CJK TC', sans-serif; fill: #222; }
  .tiny { font: 400 10px Arial, 'Noto Sans CJK TC', sans-serif; fill: #333; }
  .code { font: 400 12px 'Courier New', monospace; fill: #111; }
  .arrow { stroke: #111; stroke-width: 2.0; fill: none; marker-end: url(#arrow); }
  .dasharrow { stroke: #111; stroke-width: 1.8; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  .event { stroke: #555; stroke-width: 1.6; fill: none; stroke-dasharray: 2 6; marker-end: url(#arrowGrey); }
  .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
  .drop { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
  .note { fill: #ffffff; stroke: #777; stroke-width: 1.2; stroke-dasharray: 6 5; }
</style>
<rect width="1280" height="720" class="bg"/>

<rect x="42" y="76" width="244" height="522" class="boundary"/>
<text x="62" y="108" text-anchor="start" class="title">離線模型匯出</text>
<text x="62" y="132" text-anchor="start" class="small">不在執行期封包路徑上</text>
<rect x="70" y="170" width="168" height="44" class="box2"/><text x="154" y="190" text-anchor="middle" class="small">僅 BENIGN 流量</text><text x="154" y="207" text-anchor="middle" class="small">CIC-IDS-2019</text>
<line x1="154" y1="214" x2="154" y2="240" class="arrow"/>
<rect x="70" y="252" width="168" height="44" class="box2"/><text x="154" y="273" text-anchor="middle" class="small">教師模型</text><text x="154" y="290" text-anchor="middle" class="small">Contract5 連續 IF</text>
<line x1="154" y1="296" x2="154" y2="322" class="arrow"/>
<rect x="70" y="334" width="168" height="44" class="box2"/><text x="154" y="355" text-anchor="middle" class="small">蒸餾</text><text x="154" y="372" text-anchor="middle" class="small">N=2 分位桶</text>
<line x1="154" y1="378" x2="154" y2="404" class="arrow"/>
<rect x="70" y="416" width="168" height="44" class="box2"/><text x="154" y="444" text-anchor="middle" class="code">model.json</text>

<rect x="314" y="76" width="924" height="522" class="boundary"/>
<text x="334" y="108" text-anchor="start" class="title">執行期主機</text>
<rect x="334" y="132" width="884" height="188" class="boundary"/>
<text x="356" y="164" text-anchor="start" class="title">Rust 使用者空間控制面</text>
