<rect x="42" y="630" width="660" height="48" class="note"/>
<text x="62" y="651" text-anchor="start" class="label">範圍說明</text>
<text x="62" y="670" text-anchor="start" class="small">執行期推論為 eBPF 5-bit SCORE_TABLE；完整 IF 僅離線；TC 非目前評分器。</text>
<rect x="760" y="630" width="478" height="48" class="box2"/>
<line x1="786" y1="654" x2="828" y2="654" class="arrow"/><text x="840" y="658" text-anchor="start" class="small">封包路徑</text>
<line x1="970" y1="654" x2="1012" y2="654" class="dasharrow"/><text x="1024" y="658" text-anchor="start" class="small">控制 / map 更新</text>
<line x1="1158" y1="654" x2="1200" y2="654" class="event"/><text x="1210" y="658" text-anchor="start" class="small">事件</text>
</svg>
