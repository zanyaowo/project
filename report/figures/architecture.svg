<rect x="950" y="536" width="86" height="38" class="drop"/><text x="993" y="560" text-anchor="middle" class="label">DROP</text>
<rect x="1070" y="494" width="126" height="66" class="dash"/><text x="1133" y="516" text-anchor="middle" class="label">TC 分類器</text><text x="1133" y="537" text-anchor="middle" class="small">擴充掛載點</text><text x="1133" y="555" text-anchor="middle" class="small">未來策略</text>
